<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Body Factory</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto;padding-bottom:78px}header{background:#111827;color:white;padding:18px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:22px}main{padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0001}.title{font-size:19px;font-weight:750;margin-bottom:10px}.stat b{display:block;font-size:21px}.muted{color:#6b7280;font-size:13px}.progress{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#2563eb}input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:white}label{display:block;font-size:13px;color:#4b5563;margin:8px 0 5px}button{border:0;border-radius:10px;padding:11px 13px;background:#2563eb;color:white;font-weight:700}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#dc2626}button.full{width:100%;margin-top:9px}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.item{padding:11px 0;border-bottom:1px solid #eee}.empty{text-align:center;color:#6b7280;padding:20px}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;z-index:10}nav div{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}nav button{background:white;color:#4b5563;border-radius:0;padding:8px 2px;font-size:11px}nav button.active{color:#2563eb}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#111827;color:white;padding:10px 14px;border-radius:10px;display:none;z-index:20}dialog{border:0;border-radius:18px;width:min(92vw,500px);padding:0;box-shadow:0 10px 50px #0007}.modal{padding:18px}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}} </style></head><body>
<div class="app"><header><h1>BODY FACTORY</h1><small>Твоя экономика организма</small></header><main id="app"></main></div>
