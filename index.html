<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Body Factory — игровая система похудения">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Body Factory</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    button,input,select{font:inherit}
    .app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:82px}
    header{background:#111827;color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:5}
    header h1{margin:0;font-size:22px} header small{opacity:.7}
    main{padding:14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .card{background:white;border-radius:16px;padding:15px;box-shadow:0 2px 10px #0000000d;margin-bottom:12px}
    .stat b{display:block;font-size:21px;margin-top:4px}
    .title{font-size:19px;font-weight:750;margin:4px 0 10px}
    .muted{color:#6b7280;font-size:13px}
    .progress{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}
    .progress>div{height:100%;background:#2563eb;border-radius:99px}
    .row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}
    input,select{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;background:white}
    label{font-size:13px;color:#4b5563;display:block;margin:8px 0 5px}
    button{border:0;border-radius:10px;padding:11px 13px;background:#2563eb;color:white;font-weight:650;cursor:pointer}
    button.secondary{background:#e5e7eb;color:#111827} button.danger{background:#dc2626}
    button.full{width:100%;margin-top:9px}
    .foodrow,.productrow,.dayrow{padding:11px 0;border-bottom:1px solid #eee}
    nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;z-index:10}
    nav .navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}
    nav button{background:white;color:#4b5563;border-radius:0;padding:9px 2px;font-size:11px}
    nav button.active{color:#2563eb;font-weight:800}
    .empty{padding:20px;text-align:center;color:#6b7280}
    canvas{width:100%;height:190px}
    .toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:20}
    @media(min-width:600px){main{padding:20px}.grid{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<div class="app">
  <header><h1>BODY FACTORY</h1><small>Твоя экономика организма</small></header>
  <main id="app"></main>
</div>
<nav><div class="navin">
  <button data-screen="home">🏭<br>База</button>
  <button data-screen="food">🍽️<br>Еда</button>
  <button data-screen="products">🍎<br>Склад</button>
  <button data-screen="diary">📖<br>Дневник</button>
  <button data-screen="settings">⚙️<br>Настройки</button>
</div></nav>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
