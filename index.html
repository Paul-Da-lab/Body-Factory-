<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Body Factory</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:75px}header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:3}header h1{margin:0;font-size:22px}main{padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0001}.stat b{display:block;font-size:21px;margin-top:4px}.title{font-size:19px;font-weight:750;margin-bottom:10px}.muted{color:#6b7280;font-size:13px}.progress{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress div{height:100%;background:#2563eb}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:#fff}label{display:block;font-size:13px;color:#4b5563;margin:8px 0 5px}button{border:0;border-radius:10px;padding:11px 13px;background:#2563eb;color:#fff;font-weight:650}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#dc2626}.full{width:100%;margin-top:9px}.item{padding:11px 0;border-bottom:1px solid #eee}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;z-index:5}.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}nav button{background:#fff;color:#4b5563;border-radius:0;font-size:11px;padding:8px 2px}nav button.active{color:#2563eb}.empty{text-align:center;color:#6b7280;padding:18px}.toast{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;z-index:10}dialog{border:0;border-radius:18px;width:min(92vw,500px);padding:0}dialog::backdrop{background:#0008}.modal{padding:18px}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}} </style></head><body><div class="app"><header><h1>BODY FACTORY</h1><small>Твоя экономика организма</small></header><main id="app"></main></div><nav><div class="nav"><button data-s="home">🏭<br>База</button><button data-s="food">🍽️<br>Еда</button><button data-s="products">🍎<br>Склад</button><button data-s="diary">📖<br>Дневник</button><button data-s="settings">⚙️<br>Настройки</button></div></nav><div id="toast" class="toast"></div><dialog id="pd"><form class="modal" onsubmit="return createProduct(event)"><div class="title">Новый продукт</div><label>Название</label><input id="pn" required><label>Ккал / 100 г</label><input id="pk" type="number" min="0" step=".1" required><label>Белок / 100 г</label><input id="pp" type="number" min="0" step=".1" required><div class="row" style="margin-top:12px"><button>Сохранить</button><button type="button" class="secondary" onclick="pd.close()">Отмена</button></div></form></dialog><script src="app.js?v=3"></script></body></html>
